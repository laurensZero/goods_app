# Supabase data-plane reverse proxy (backup endpoint for CN Mobile)
# api.goodsapp.de5.net -> zvqzicimowfqshgjsrri.supabase.co

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 备用线路流量日志（JSON 行，供 backup_server /api/backup/traffic 聚合）
log_format api_goodsapp escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","status":$status,'
    '"bytes_sent":$body_bytes_sent,"request":"$request","uri":"$uri",'
    '"request_uri":"$request_uri","upstream_response_time":"$upstream_response_time"}';

server {
    listen 80;
    listen [::]:80;
    server_name api.goodsapp.de5.net;
    access_log /www/wwwlogs/api.goodsapp.de5.net.log api_goodsapp;

    # Let's Encrypt HTTP-01
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme.api.goodsapp.de5.net;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.goodsapp.de5.net;
    access_log /www/wwwlogs/api.goodsapp.de5.net.log api_goodsapp;

    ssl_certificate     /www/server/panel/vhost/cert/api.goodsapp.de5.net/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.goodsapp.de5.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host zvqzicimowfqshgjsrri.supabase.co;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_ssl_server_name on;
    proxy_ssl_name zvqzicimowfqshgjsrri.supabase.co;

    proxy_connect_timeout 15s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location / {
        proxy_pass https://zvqzicimowfqshgjsrri.supabase.co;
    }

    # Realtime WebSocket long-lived
    location ~ ^/(realtime|graphql)/ {
        proxy_pass https://zvqzicimowfqshgjsrri.supabase.co;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
