# Supabase 数据面备用反代
# 域名：api.goodsapp.de5.net → https://zvqzicimowfqshgjsrri.supabase.co
# 只代理数据面（REST/Auth/Functions/Realtime），图片公链仍走主域名省带宽。
#
# 部署（以 Ubuntu + nginx + certbot 为例）：
#   1. DNS：api.goodsapp.de5.net A/AAAA → VPS IP
#   2. 保存本文件到 /etc/nginx/sites-available/supabase-proxy
#   3. ln -s /etc/nginx/sites-available/supabase-proxy /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. certbot --nginx -d api.goodsapp.de5.net
#
# 注意：proxy_ssl_server_name on —— Supabase 按 SNI 路由，不带会握手失败。

upstream supabase_primary {
    server zvqzicimowfqshgjsrri.supabase.co:443;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.goodsapp.de5.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.goodsapp.de5.net;

    ssl_certificate     /etc/letsencrypt/live/api.goodsapp.de5.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.goodsapp.de5.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 批量图片上传等 body 上限（IMAGE_FILE_SIZE_LIMIT = 1MB，留余量）
    client_max_body_size 10m;

    # 数据面路径（不含 /storage/v1/object/public —— 公链不走这里）
    location ~ ^/(rest|auth|storage|functions|realtime|graphql)/ {
        proxy_pass https://supabase_primary;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host zvqzicimowfqshgjsrri.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Realtime WebSocket 需要更长读超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health / root 探测
    location = / {
        proxy_pass https://supabase_primary;
        proxy_ssl_server_name on;
        proxy_set_header Host zvqzicimowfqshgjsrri.supabase.co;
    }

    location / {
        return 404;
    }
}
