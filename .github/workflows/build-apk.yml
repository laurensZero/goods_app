name: Build Android APK

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      release_tag:
        description: Release tag for manual release builds, for example v1.0.0 (build_type=release 必填)
        required: false
        type: string
      update_level:
        description: App 更新级别（仅 build_type=release 生效）
        required: false
        default: prompt
        type: choice
        options:
          - prompt
          - force
          - silent

jobs:
  build-debug:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Install dependencies
        run: npm ci

      - name: Validate Secret
        run: |
          if [ -z "${{ secrets.VITE_GITHUB_OAUTH_CLIENT_ID }}" ]; then
            echo "::error::Secret 未配置或读取为空！"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_AMAP_KEY }}" ]; then
            echo "::error::Secret VITE_AMAP_KEY 未配置或读取为空！"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_AMAP_SECURITY_CODE }}" ]; then
            echo "::error::Secret VITE_AMAP_SECURITY_CODE 未配置或读取为空！"
            exit 1
          fi

      - name: Build web assets and sync Android project
        env:
          VITE_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.VITE_GITHUB_OAUTH_CLIENT_ID }}
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_AMAP_SECURITY_CODE: ${{ secrets.VITE_AMAP_SECURITY_CODE }}
        run: npm run build:android

      - name: Prepare Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goods-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing secret: ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing secret: ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Determine release tag
        id: release_meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_RELEASE_TAG// /}"
            if [ -z "${TAG}" ]; then
              echo "release_tag is required when build_type=release" >&2
              exit 1
            fi
            # Force-update tag to current HEAD (same version, new build)
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "$TAG"
            echo "Force-updated tag $TAG -> $GITHUB_SHA"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION_NAME="$TAG"
          VERSION_NAME="${VERSION_NAME#v}"
          VERSION_NAME="${VERSION_NAME#V}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          # Keep the Storage filename stable regardless of whether the Git tag is v1.10.2 or 1.10.2.
          echo "asset_name=goods-app-$VERSION_NAME-release.apk" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci
      - name: Validate Secret
        run: |
          if [ -z "${{ secrets.VITE_GITHUB_OAUTH_CLIENT_ID }}" ]; then
            echo "::error::Secret 未配置或读取为空！"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_AMAP_KEY }}" ]; then
            echo "::error::Secret VITE_AMAP_KEY 未配置或读取为空！"
            exit 1
          fi
          if [ -z "${{ secrets.VITE_AMAP_SECURITY_CODE }}" ]; then
            echo "::error::Secret VITE_AMAP_SECURITY_CODE 未配置或读取为空！"
            exit 1
          fi
      - name: Build web assets and sync Android project
        env:
          VITE_APP_VERSION: ${{ steps.release_meta.outputs.version_name }}
          VITE_ANDROID_VERSION_NAME: ${{ steps.release_meta.outputs.version_name }}
          VITE_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.VITE_GITHUB_OAUTH_CLIENT_ID }}
          VITE_AMAP_KEY: ${{ secrets.VITE_AMAP_KEY }}
          VITE_AMAP_SECURITY_CODE: ${{ secrets.VITE_AMAP_SECURITY_CODE }}
        run: npm run build:android

      - name: Prepare Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.release_meta.outputs.version_name }}
        run: ./gradlew assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: goods-app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Generate release notes from commits
        id: release_notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_UPDATE_LEVEL: ${{ github.event.inputs.update_level || 'prompt' }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          git fetch --tags --force

          APK_SHA256=$(sha256sum android/app/build/outputs/apk/release/app-release.apk | awk '{print $1}')

          UPDATE_LEVEL="prompt"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            CANDIDATE_LEVEL=$(printf '%s' "${INPUT_UPDATE_LEVEL}" | tr '[:upper:]' '[:lower:]')
            if [[ "${CANDIDATE_LEVEL}" == "force" || "${CANDIDATE_LEVEL}" == "prompt" || "${CANDIDATE_LEVEL}" == "silent" ]]; then
              UPDATE_LEVEL="${CANDIDATE_LEVEL}"
            fi
          else
            TAG_OBJECT_TYPE=$(git cat-file -t "refs/tags/${RELEASE_TAG}" 2>/dev/null || true)
            if [ "${TAG_OBJECT_TYPE}" = "tag" ]; then
              TAG_MESSAGE=$(git for-each-ref "refs/tags/${RELEASE_TAG}" --format='%(contents)' || true)
              TAG_LEVEL=$(printf '%s\n' "${TAG_MESSAGE}" | sed -nE 's/.*(update_level|更新级别)[[:space:]]*[:=][[:space:]]*(force|prompt|silent).*/\2/ip' | head -n 1 | tr '[:upper:]' '[:lower:]')
              if [ -n "${TAG_LEVEL}" ]; then
                UPDATE_LEVEL="${TAG_LEVEL}"
              fi
            fi
          fi

          PREVIOUS_TAG=""
          # Check if the tag already exists (push trigger) or is new (workflow_dispatch)
          if git rev-parse "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            # Tag exists: find the previous tag relative to it
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
            if [ -z "$PREVIOUS_TAG" ]; then
              PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)
            fi
            RANGE="${PREVIOUS_TAG}..${RELEASE_TAG}"
          else
            # New tag (workflow_dispatch): compare against the latest existing tag
            PREVIOUS_TAG=$(git tag --sort=-creatordate | head -n 1 || true)
            RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          if [ -z "$PREVIOUS_TAG" ]; then
            RANGE="HEAD~20..HEAD"
          fi

          echo "update_level=${UPDATE_LEVEL}" >> "$GITHUB_OUTPUT"
          echo "update_level: ${UPDATE_LEVEL}" > release-notes.md
          echo "apk_sha256: ${APK_SHA256}" >> release-notes.md
          echo "" >> release-notes.md
          echo "## 更新说明" >> release-notes.md
          echo "" >> release-notes.md

          HAS_NOTES=0
          for COMMIT in $(git rev-list --reverse "$RANGE"); do
            TITLE=$(git log -1 --format=%s "$COMMIT")
            TITLE_LOWER=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]')

            if [[ "$TITLE_LOWER" == merge\ * ]]; then
              continue
            fi

            if [[ "$TITLE_LOWER" == chore:* || "$TITLE_LOWER" == "chore "* || "$TITLE_LOWER" == chore\(* ]]; then
              continue
            fi

            FILES=$(git diff-tree --no-commit-id --name-only -r "$COMMIT")
            if [ -z "$FILES" ]; then
              continue
            fi

            if ! echo "$FILES" | grep -qvE '^\.github/workflows/'; then
              continue
            fi

            echo "- $TITLE" >> release-notes.md
            BODY=$(git log -1 --format=%b "$COMMIT")
            if [ -n "$BODY" ]; then
              while IFS= read -r LINE || [ -n "$LINE" ]; do
                if [ -n "$LINE" ]; then
                  echo "  $LINE" >> release-notes.md
                else
                  echo "" >> release-notes.md
                fi
              done <<< "$BODY"
            fi
            echo "" >> release-notes.md
            HAS_NOTES=1
          done

          if [ "$HAS_NOTES" -eq 0 ]; then
            echo "- 本次更新无可用变更说明" >> release-notes.md
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          # Try create first; if tag already has a release, fall back to edit
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md --target "$GITHUB_SHA" 2>/dev/null || \
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_ASSET_NAME: ${{ steps.release_meta.outputs.asset_name }}
        run: |
          gh release upload "$RELEASE_TAG" "android/app/build/outputs/apk/release/app-release.apk#$RELEASE_ASSET_NAME" --clobber

      - name: Upload APK to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://zvqzicimowfqshgjsrri.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version_name }}
          RELEASE_ASSET_NAME: ${{ steps.release_meta.outputs.asset_name }}
          APK_SHA256: ${{ steps.release_meta.outputs.apk_sha256 }}
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY not set, skipping Supabase upload."
            exit 0
          fi

          APK_FILE="android/app/build/outputs/apk/release/app-release.apk"
          STORAGE_PATH="apk/${RELEASE_ASSET_NAME}"

          # Compute SHA256 if not already done
          APK_SHA256=$(sha256sum "${APK_FILE}" | awk '{print $1}')
          FILE_SIZE=$(stat -c%s "${APK_FILE}")

          echo "Uploading APK to Supabase Storage: ${STORAGE_PATH}"
          curl -sS -f -X POST \
            "${SUPABASE_URL}/storage/v1/object/ota-releases/${STORAGE_PATH}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@${APK_FILE}" \
            -w "\nHTTP %{http_code}"

          echo ""
          echo "Upserting APK record into ota_releases..."

          PAYLOAD=$(jq -n \
            --arg channel "stable" \
            --arg type "apk" \
             --arg version "${RELEASE_VERSION}" \
            --arg storage_path "${STORAGE_PATH}" \
            --argjson file_size "${FILE_SIZE}" \
            --arg sha256 "${APK_SHA256}" \
            --arg update_level "${{ steps.release_notes.outputs.update_level || 'prompt' }}" \
            --arg notes "$(cat release-notes.md)" \
            '{
              channel: $channel,
              type: $type,
              version: $version,
              storage_path: $storage_path,
              file_size: $file_size,
              sha256: $sha256,
              update_level: $update_level,
              notes: $notes
            }')

          VERSION_ENCODED=$(printf '%s' "${RELEASE_VERSION}" | jq -sRr @uri)
          EXISTING=$(curl -sS -f \
            "${SUPABASE_URL}/rest/v1/ota_releases?select=id&channel=eq.stable&type=eq.apk&version=eq.${VERSION_ENCODED}&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")
          EXISTING_ID=$(echo "${EXISTING}" | jq -r '.[0].id // empty')

          if [ -n "${EXISTING_ID}" ]; then
            echo "Updating existing APK record id=${EXISTING_ID}"
            curl -sS -f -X PATCH \
              "${SUPABASE_URL}/rest/v1/ota_releases?id=eq.${EXISTING_ID}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d "${PAYLOAD}" \
              -w "\nUpdate HTTP %{http_code}"
          else
            echo "Inserting new APK record"
            curl -sS -f -X POST \
              "${SUPABASE_URL}/rest/v1/ota_releases" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d "${PAYLOAD}" \
              -w "\nInsert HTTP %{http_code}"
          fi

          echo ""
          echo "Pruning old APKs, keeping latest 2..."

          ALL_APKS=$(curl -sS -X GET \
            "${SUPABASE_URL}/rest/v1/ota_releases?select=id,storage_path&type=eq.apk&order=published_at.desc" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json")

          TOTAL=$(echo "${ALL_APKS}" | jq 'length')
          echo "Total APK records: ${TOTAL}"

          if [ "${TOTAL}" -gt 2 ]; then
            echo "${ALL_APKS}" | jq -c '.[2:][]' | while read -r ROW; do
              OLD_ID=$(echo "${ROW}" | jq -r '.id')
              OLD_PATH=$(echo "${ROW}" | jq -r '.storage_path // ""')

              echo "Deleting old APK #${OLD_ID} (${OLD_PATH})"

              if [ -n "${OLD_PATH}" ]; then
                ENCODED_PATH=$(echo -n "${OLD_PATH}" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read()))")
                curl -sS -X DELETE \
                  "${SUPABASE_URL}/storage/v1/object/ota-releases/${ENCODED_PATH}" \
                  -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                  -o /dev/null || true
              fi

              ENCODED_ID=$(echo -n "${OLD_ID}" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read()))")
              curl -sS -X DELETE \
                "${SUPABASE_URL}/rest/v1/ota_releases?id=eq.${ENCODED_ID}" \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -o /dev/null || true
            done
            echo "Pruning complete."
          else
            echo "No pruning needed."
          fi
