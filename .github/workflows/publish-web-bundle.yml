name: Publish Web Bundle

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '更新频道'
        required: true
        type: choice
        options: ['stable', 'beta']
        default: 'beta'
      version:
        description: '版本号 (留空自动生成 YYYYMMDD.N)'
        required: false
        type: string
        default: ''
      update_level:
        description: '更新级别'
        required: true
        type: choice
        options: ['prompt', 'force', 'silent']
        default: 'prompt'
      notes:
        description: '更新说明'
        required: false
        type: string
        default: ''
      min_native_version:
        description: '最低原生版本 (留空不限制)'
        required: false
        type: string
        default: ''
      rollback_version:
        description: '回档目标版本 (仅回档时填写)'
        required: false
        type: string
        default: ''
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**.sql'
      - '.gitignore'
      - '.gitattributes'
      - '**.md'
      - 'LICENSE'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://zvqzicimowfqshgjsrri.supabase.co' }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  # Workflow-level env for ota-bundle-manager.html build
  VITE_APP_VERSION: ${{ vars.VITE_APP_VERSION || '1.0' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    # 防止在 fork 中运行（fork 没有 secrets）
    if: github.repository == 'laurensZero/goods_app'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          ROLLBACK_VERSION: ${{ github.event.inputs.rollback_version || '' }}
          EVENT_NAME: ${{ github.event_name }}
          CHANNEL: ${{ github.event.inputs.channel || 'beta' }}
        run: |
          ROLLBACK="${ROLLBACK_VERSION}"
          if [ -n "${ROLLBACK}" ]; then
            echo "Rollback requested: ${ROLLBACK}"
            # Look up the bundle from DB
            BUNDLE_JSON=$(curl -sS -X GET \
              "${SUPABASE_URL}/rest/v1/ota_releases?select=*&channel=eq.${CHANNEL}&type=eq.web_bundle&version=eq.${ROLLBACK}&limit=1" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Accept: application/json" || echo "[]")
            STORED_PATH=$(echo "${BUNDLE_JSON}" | jq -r '.[0].storage_path // empty')
            STORED_SHA256=$(echo "${BUNDLE_JSON}" | jq -r '.[0].sha256 // empty')
            STORED_SIZE=$(echo "${BUNDLE_JSON}" | jq -r '.[0].file_size // 0')
            STORED_MIN=$(echo "${BUNDLE_JSON}" | jq -r '.[0].min_native_version // ""')
            STORED_NOTES=$(echo "${BUNDLE_JSON}" | jq -r '.[0].notes // ""')
            if [ -z "${STORED_PATH}" ]; then
              echo "::error::Rollback version ${ROLLBACK} not found in database"
              exit 1
            fi
            echo "rollback=true" >> "$GITHUB_OUTPUT"
            echo "version=${ROLLBACK}" >> "$GITHUB_OUTPUT"
            echo "storage_path=${STORED_PATH}" >> "$GITHUB_OUTPUT"
            echo "sha256=${STORED_SHA256}" >> "$GITHUB_OUTPUT"
            echo "file_size=${STORED_SIZE}" >> "$GITHUB_OUTPUT"
            echo "min_native=${STORED_MIN}" >> "$GITHUB_OUTPUT"
            echo "stored_notes=${STORED_NOTES}" >> "$GITHUB_OUTPUT"
            echo "Rollback to ${ROLLBACK}: storage=${STORED_PATH}"
            exit 0
          fi

          if [ -n "${INPUT_VERSION}" ]; then
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "Using manual version: ${INPUT_VERSION}"
            exit 0
          fi

          # Auto-generate YYYYMMDD.N version
          TODAY=$(TZ='Asia/Shanghai' date +%Y%m%d)
          echo "Today: ${TODAY}"

          # Query Supabase for the latest version with today's date prefix
          RESPONSE=$(curl -sS -X GET \
            "${SUPABASE_URL}/rest/v1/ota_releases?select=version&channel=eq.${CHANNEL}&type=eq.web_bundle&version=like.${TODAY}.*&order=published_at.desc&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json" || echo "[]")

          LATEST=$(echo "${RESPONSE}" | jq -r '.[0].version // empty')

          if [ -n "${LATEST}" ]; then
            # Extract the sequence number and increment
            SEQ=$(echo "${LATEST}" | sed -E 's/.*\.([0-9]+)$/\1/')
            NEXT_SEQ=$((SEQ + 1))
          else
            NEXT_SEQ=1
          fi

          VERSION="${TODAY}.${NEXT_SEQ}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Auto-generated version: ${VERSION} (channel: ${CHANNEL})"

      - name: Generate release notes
        id: notes
        env:
          INPUT_NOTES: ${{ github.event.inputs.notes || '' }}
          EVENT_NAME: ${{ github.event_name }}
          CHANNEL: ${{ github.event.inputs.channel || 'beta' }}
        run: |
          if [ -n "${INPUT_NOTES}" ]; then
            echo "notes<<EOF" >> "$GITHUB_OUTPUT"
            echo "${INPUT_NOTES}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "Using manual notes"
            exit 0
          fi

          # Auto-generate notes from commits since last release tag
          if [ "${EVENT_NAME}" = "push" ] || [ "${CHANNEL}" = "beta" ]; then
            git fetch --tags --force 2>/dev/null || true

            # Find the last bundle publish commit (look for the deploy step marker)
            PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v?[0-9]' | head -1 || true)

            if [ -n "${PREV_TAG}" ]; then
              RANGE="${PREV_TAG}..HEAD"
            else
              RANGE="HEAD~20..HEAD"
            fi

            NOTES=""
            for COMMIT in $(git rev-list --reverse "${RANGE}" 2>/dev/null || true); do
              TITLE=$(git log -1 --format=%s "${COMMIT}" 2>/dev/null || true)
              TITLE_LOWER=$(echo "${TITLE}" | tr '[:upper:]' '[:lower:]')

              # Skip merge commits and chore commits
              case "${TITLE_LOWER}" in
                merge\ *|"merge "*|chore:*|"chore "*|chore\(*) continue ;;
              esac

              # Skip CI-only changes
              FILES=$(git diff-tree --no-commit-id --name-only -r "${COMMIT}" 2>/dev/null || true)
              if [ -n "${FILES}" ] && ! echo "${FILES}" | grep -qvE '^\.github/workflows/'; then
                continue
              fi

              NOTES="${NOTES}- ${TITLE}"$'\n'
            done

            if [ -z "${NOTES}" ]; then
              NOTES="本次更新无可用变更说明"
            fi

            echo "notes<<EOF" >> "$GITHUB_OUTPUT"
            echo "${NOTES}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "Auto-generated notes from commits"
          else
            echo "notes<<EOF" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "No notes provided"
          fi

      - name: Build web assets
        if: steps.version.outputs.rollback != 'true'
        run: npm run build

      - name: Create bundle archive
        if: steps.version.outputs.rollback != 'true'
        id: bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUNDLE_NAME="bundle-${VERSION}.zip"
          STORAGE_PATH="stable/${BUNDLE_NAME}"

          if [ "${{ github.event.inputs.channel || 'beta' }}" = "beta" ]; then
            STORAGE_PATH="beta/${BUNDLE_NAME}"
          fi

          echo "Bundle: ${BUNDLE_NAME}"
          echo "Storage path: ${STORAGE_PATH}"

          cd dist
          zip -r "../${BUNDLE_NAME}" .
          cd ..

          SHA256=$(sha256sum "${BUNDLE_NAME}" | awk '{print $1}')
          FILE_SIZE=$(stat -c%s "${BUNDLE_NAME}")

          echo "bundle_name=${BUNDLE_NAME}" >> "$GITHUB_OUTPUT"
          echo "storage_path=${STORAGE_PATH}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "file_size=${FILE_SIZE}" >> "$GITHUB_OUTPUT"

          echo "SHA256: ${SHA256}"
          echo "File size: ${FILE_SIZE} bytes"

      - name: Upload bundle to Supabase Storage
        if: steps.version.outputs.rollback != 'true'
        env:
          BUNDLE_NAME: ${{ steps.bundle.outputs.bundle_name }}
          STORAGE_PATH: ${{ steps.bundle.outputs.storage_path }}
        run: |
          echo "Uploading to Supabase Storage: ${STORAGE_PATH}"
          curl -sS -X POST \
            "${SUPABASE_URL}/storage/v1/object/ota-releases/${STORAGE_PATH}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/zip" \
            -H "x-upsert: true" \
            --data-binary "@${BUNDLE_NAME}" \
            -w "\nHTTP %{http_code}"

      - name: Insert bundle record into ota_releases
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IS_ROLLBACK: ${{ steps.version.outputs.rollback }}
          # Normal publish: use bundle step outputs
          BUNDLE_PATH: ${{ steps.bundle.outputs.storage_path }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
          BUNDLE_SIZE: ${{ steps.bundle.outputs.file_size }}
          # Rollback: use version step outputs (from DB lookup)
          ROLLBACK_PATH: ${{ steps.version.outputs.storage_path }}
          ROLLBACK_SHA256: ${{ steps.version.outputs.sha256 }}
          ROLLBACK_SIZE: ${{ steps.version.outputs.file_size }}
          ROLLBACK_MIN: ${{ steps.version.outputs.min_native }}
          ROLLBACK_NOTES: ${{ steps.version.outputs.stored_notes }}
          CHANNEL: ${{ github.event.inputs.channel || 'beta' }}
          UPDATE_LEVEL: ${{ github.event.inputs.update_level || 'prompt' }}
          NOTES: ${{ steps.notes.outputs.notes }}
          MIN_NATIVE_VERSION: ${{ github.event.inputs.min_native_version || '' }}
        run: |
          echo "Inserting into ota_releases table..."

          if [ "${IS_ROLLBACK}" = "true" ]; then
            STORAGE_PATH="${ROLLBACK_PATH}"
            SHA256="${ROLLBACK_SHA256}"
            FILE_SIZE="${ROLLBACK_SIZE}"
            NOTES="${ROLLBACK_NOTES}"
            MIN_NATIVE_VERSION="${ROLLBACK_MIN}"
          else
            STORAGE_PATH="${BUNDLE_PATH}"
            SHA256="${BUNDLE_SHA256}"
            FILE_SIZE="${BUNDLE_SIZE}"
          fi

          echo "version=${VERSION} path=${STORAGE_PATH} sha256=${SHA256}"

          PAYLOAD=$(jq -n \
            --arg channel "${CHANNEL}" \
            --arg type "web_bundle" \
            --arg version "${VERSION}" \
            --arg storage_path "${STORAGE_PATH}" \
            --argjson file_size "${FILE_SIZE}" \
            --arg sha256 "${SHA256}" \
            --arg update_level "${UPDATE_LEVEL}" \
            --arg notes "${NOTES}" \
            --arg min_native_version "${MIN_NATIVE_VERSION}" \
            '{
              channel: $channel,
              type: $type,
              version: $version,
              storage_path: $storage_path,
              file_size: $file_size,
              sha256: $sha256,
              update_level: $update_level,
              notes: $notes,
              min_native_version: (if $min_native_version == "" then null else $min_native_version end)
            }')

          HTTP_CODE=$(curl -sS -X POST \
            "${SUPABASE_URL}/rest/v1/ota_releases" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "${PAYLOAD}" \
            -o /dev/null -w "%{http_code}")

          if [ "${HTTP_CODE}" = "201" ]; then
            echo "Bundle record inserted successfully."
          else
            echo "::warning::Insert returned HTTP ${HTTP_CODE}"
          fi

      - name: Prune old bundles (keep latest 3)
        env:
          CHANNEL: ${{ github.event.inputs.channel || 'beta' }}
        run: |
          echo "Pruning old bundles for channel: ${CHANNEL} (keeping latest 3)"

          # Fetch all bundles for this channel, ordered by published_at desc
          ALL_BUNDLES=$(curl -sS -X GET \
            "${SUPABASE_URL}/rest/v1/ota_releases?select=id,storage_path&channel=eq.${CHANNEL}&type=eq.web_bundle&order=published_at.desc" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Accept: application/json")

          TOTAL=$(echo "${ALL_BUNDLES}" | jq 'length')
          echo "Total bundles: ${TOTAL}"

          if [ "${TOTAL}" -le 3 ] || [ -z "${ALL_BUNDLES}" ]; then
            echo "No pruning needed (${TOTAL} <= 3)."
            exit 0
          fi

          # Keep first 3, delete the rest
          TO_DELETE=$(echo "${ALL_BUNDLES}" | jq -c '.[3:]')
          echo "${TO_DELETE}" | jq -c '.[]' | while read -r BUNDLE; do
            BUNDLE_ID=$(echo "${BUNDLE}" | jq -r '.id')
            STORAGE_PATH=$(echo "${BUNDLE}" | jq -r '.storage_path // ""')

            echo "Deleting bundle #${BUNDLE_ID} (${STORAGE_PATH})"

            # Delete from storage
            if [ -n "${STORAGE_PATH}" ]; then
              STORAGE_ENCODED=$(echo -n "${STORAGE_PATH}" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read()))")
              curl -sS -X DELETE \
                "${SUPABASE_URL}/storage/v1/object/ota-releases/${STORAGE_ENCODED}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                -o /dev/null -w "  Storage: HTTP %{http_code}\n" || true
            fi

            # Delete from table
            BUNDLE_ENC=$(echo -n "${BUNDLE_ID}" | python3 -c "import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read()))")
            curl -sS -X DELETE \
              "${SUPABASE_URL}/rest/v1/ota_releases?id=eq.${BUNDLE_ENC}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -o /dev/null -w "  Table: HTTP %{http_code}\n" || true
          done

          echo "Pruning complete."

      - name: Prepare manager page
        run: |
          mkdir -p ghpages-deploy
          cp docs/ota-bundle-manager.html ghpages-deploy/index.html

      - name: Deploy manager page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ghpages-deploy
          destination_dir: .
          keep_files: true

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ github.event.inputs.channel || 'beta' }}
          SHA256: ${{ steps.bundle.outputs.sha256 }}
          STORAGE_PATH: ${{ steps.bundle.outputs.storage_path }}
        run: |
          echo "## Web Bundle Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Channel:** ${CHANNEL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA256:** \`${SHA256}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Storage:** \`${STORAGE_PATH}\`" >> "$GITHUB_STEP_SUMMARY"
