<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>安全验证 · 谷子收纳</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f7;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:18px;overflow:hidden;">
          <tr>
            <td style="background:linear-gradient(145deg,#17181c 0%,#24262d 52%,#33363e 100%);padding:28px 28px 24px;">
              <img src="https://goodsapp.de5.net/assets/logo-email.png" width="48" height="48" alt="谷子收纳" style="display:block;width:48px;height:48px;border-radius:12px;margin-bottom:14px;border:0;" />
              <div style="color:#ffffff;font-size:20px;font-weight:600;letter-spacing:0.02em;">谷子收纳</div>
              <div style="color:rgba(255,255,255,0.56);font-size:13px;margin-top:8px;">安全验证</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 28px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
              <p style="margin:0 0 16px;color:#141416;font-size:15px;line-height:1.6;">你好，</p>
              <p style="margin:0 0 20px;color:#5f6570;font-size:14px;line-height:1.7;">为确认是你本人操作，请输入下面的验证码完成安全验证。</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px;">
                <tr>
                  <td align="center" style="background:#f5f5f7;border-radius:12px;padding:20px 16px;">
                    <div style="color:#8e8e93;font-size:12px;margin-bottom:8px;">验证码</div>
                    <div style="color:#141416;font-size:28px;font-weight:700;letter-spacing:0.18em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">{{ .Token }}</div>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 8px;color:#5f6570;font-size:13px;line-height:1.6;">验证码有效期有限，请尽快在 App 内输入。</p>
              <p style="margin:0 0 8px;color:#5f6570;font-size:13px;line-height:1.6;">如果不是你本人操作，忽略本邮件即可。</p>
              <p style="margin:20px 0 0;padding-top:16px;border-top:1px solid #eef0f2;color:#a1a1a6;font-size:12px;line-height:1.5;">谷子收纳 · 本邮件为系统自动发送，请勿直接回复</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
