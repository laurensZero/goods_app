[project]
id = "zvqzicimowfqshgjsrri"

[functions.delete-user]
verify_jwt = false

# QQ 机器人 webhook：接收 QQ 平台事件（绑定码激活）
[functions.qq-webhook]
verify_jwt = false

# 通知分发器：每分钟投递队列
[functions.notify-dispatch]
verify_jwt = false
schedule = "*/1 * * * *"

# 米游铺上新扫描：由 pg_cron 或网页端 schedule 两套调度触发
#   ?catalog=shop   商店「即将上架」全天每 20 分钟 + 北京 12:00-12:05 / 18:00-18:05 每分钟补扫
#   ?catalog=point  积分商城每小时
# （config.toml 每个函数只能写一个 schedule，多个调度用 pg_cron SQL 注册，见计划文档）
[functions.scan-mihoyo]
verify_jwt = false

# 米游铺商品有货监控：调度粒度 1 分钟（对外请求量由 next_check_at 自适应控制，
# 缺货商品间隔 1→15 分钟爬坡，有货商品 60 分钟低频复查），有货时经 QQ 推送提醒
[functions.scan-mihoyo-stock]
verify_jwt = false
schedule = "*/1 * * * *"

# 功能白名单校验（自助下单等）：必须携带登录 JWT（verify_jwt=true），feature 走 query 参数
[functions.check-feature-permission]
verify_jwt = true

# 云端智能抠图（FAPIhub）：白名单用户图片转发，必须携带登录 JWT（verify_jwt=true）
# 需配置 Secret：FAPIHUB_API_KEY
[functions.remove-bg]
verify_jwt = true

# 毫秒级精确时间源：自助下单定时校准用，无需登录
[functions.get-server-time]
verify_jwt = false

# 汇率权威源：每日 15:30 UTC（约北京时间 23:30，晚于 ECB 每日发布）刷新
# 人民币基准汇率到 exchange_rates 单行表；所有设备从该表读取同一份快照
[functions.refresh-exchange-rates]
verify_jwt = false
schedule = "30 15 * * *"

# 地址 → 城市地理编码（高德 Web 服务）：必须携带登录 JWT（verify_jwt=true）
# 需配置 Secret：AMAP_WEB_API_KEY
[functions.geocode-address]
verify_jwt = true