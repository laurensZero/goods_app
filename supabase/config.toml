[project]
id = "zvqzicimowfqshgjsrri"

[functions.delete-user]
verify_jwt = false

# QQ 机器人 webhook：接收 QQ 平台事件（绑定码激活）
[functions.qq-webhook]
verify_jwt = false

# 通知分发器：每分钟投递队列
[functions.notify-dispatch]
verify_jwt = false
schedule = "*/1 * * * *"

# 米游铺上新扫描：由 pg_cron 或网页端 schedule 两套调度触发
#   ?catalog=shop   商店「即将上架」全天每 20 分钟 + 北京 12:00-12:05 / 18:00-18:05 每分钟补扫
#   ?catalog=point  积分商城每小时
# （config.toml 每个函数只能写一个 schedule，多个调度用 pg_cron SQL 注册，见计划文档）
[functions.scan-mihoyo]
verify_jwt = false

# 米游铺自助下单白名单校验：必须携带登录 JWT（verify_jwt=true）
[functions.check-checkout-permission]
verify_jwt = true

# 毫秒级精确时间源：自助下单定时校准用，无需登录
[functions.get-server-time]
verify_jwt = false

# 汇率权威源：每日 15:30 UTC（约北京时间 23:30，晚于 ECB 每日发布）刷新
# 人民币基准汇率到 exchange_rates 单行表；所有设备从该表读取同一份快照
[functions.refresh-exchange-rates]
verify_jwt = false
schedule = "30 15 * * *"
