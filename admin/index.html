<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="description" content="Goods 谷子收纳 管理控制台" />
    <title>Goods APP 管理台</title>
    <script>
      /* 首屏无闪烁：在 Vue 挂载前尽早应用主题 class */
      (function () {
        try {
          var key = 'goods_admin_theme_preference'
          var stored = localStorage.getItem(key)
          var dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('theme-dark', dark)
        } catch (e) {}
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-D7omQ2V4.js"></script>
